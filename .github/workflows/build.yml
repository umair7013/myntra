name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: NPM Install
        run: npm install

      - uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # - name: Docker Login
      #   run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Docker build and push
        env:
          DOCKER_CLI_ACI: 1
        run: |
          docker build -t myntra:latest .
          docker tag myntra:latest aliumair0/myntra:latest
          docker push aliumair0/myntra:latest

      - name: Docker Scout Image Scan
        run: |
          docker-scout quickview aliumair0/myntra:latest
          docker-scout cves aliumair0/myntra:latest


      
